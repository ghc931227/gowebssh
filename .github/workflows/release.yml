name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主流发行版
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # 玩客云(OneCloud, Amlogic S805 ARMv7) / 树莓派 32 位等
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -e
          NAME="gowebssh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          echo "Building ${NAME}${EXT}"
          go build -trimpath -ldflags "-s -w" -o "dist/${NAME}${EXT}" .
          cp README.md dist/README.md

          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "${NAME}.zip" "${NAME}${EXT}" README.md
          else
            tar czf "${NAME}.tar.gz" "${NAME}${EXT}" README.md
          fi
          # 32 位 ARM 产物附 SHA256 校验值，方便刷机环境核对
          sha256sum "${NAME}${EXT}" > "${NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*
          retention-days: 5

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 删除旧的 release 条目（保留 git tag，仅当前版本除外）
          gh release list --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "${{ github.ref_name }}" ]; then
              echo "Deleting release $tag"
              gh release delete "$tag" --yes
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
