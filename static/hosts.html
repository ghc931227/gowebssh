<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title> Edit Hosts </title>
    <link href="img/favicon.png" rel="icon" type="image/png"/>
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <style>
        html, body {
            margin: 0;
        }

        body {
            background: #f0f2f5;
        }

        .page-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 16px 60px;
        }

        .form-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
            overflow: hidden;
        }

        .form-card-head {
            background: #2c3e50;
            color: #fff;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-card-body {
            padding: 20px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .table-wrap {
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            overflow: auto;
        }

        table.edit-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            margin-bottom: 0;
        }

        table.edit-table th {
            background: #f6f8fa;
            color: #57606a;
            font-size: 12px;
            font-weight: 600;
            padding: 10px;
            border-bottom: 1px solid #e1e4e8;
            white-space: nowrap;
        }

        table.edit-table td {
            padding: 8px;
            border-bottom: 1px solid #eef1f4;
            vertical-align: middle;
        }

        table.edit-table tr:last-child td {
            border-bottom: none;
        }

        table.edit-table .form-control {
            border-radius: 6px;
            border: 1px solid #d0d7de;
            padding: 6px 10px;
            font-size: 13px;
            height: auto;
            box-shadow: none;
            width: 100%;
            min-width: 70px;
        }

        table.edit-table .form-control:focus {
            border-color: #3c8dbc;
            box-shadow: 0 0 0 3px rgba(60, 141, 188, .15);
            outline: none;
        }

        table.edit-table textarea.form-control {
            resize: vertical;
        }

        .btn {
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
        }

        .actions-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="form-card">
        <div class="form-card-head">
            <span data-i18n="page.hosts">主机管理</span>
            <span class="lang-switch"></span>
        </div>
        <div class="form-card-body">
            <div class="toolbar">
                <button onclick="checkedRow.prev().before(checkedRow);" type="button" class="btn btn-outline-primary" data-i18n="btn.up">上移</button>
                <button onclick="checkedRow.next().after(checkedRow);" type="button" class="btn btn-outline-primary" data-i18n="btn.down">下移</button>
                <button onclick="checkedRow.remove();" type="button" class="btn btn-danger" data-i18n="btn.delete">删除</button>
            </div>
            <div class="table-wrap">
                <table class="edit-table">
                    <thead>
                    <tr>
                        <th><input type="radio" value="false" disabled></th>
                        <th data-i18n="th.name">名称</th>
                        <th data-i18n="label.hostname">主机地址</th>
                        <th data-i18n="label.port">端口</th>
                        <th data-i18n="label.username">用户名</th>
                        <th data-i18n="label.password">密码</th>
                        <th>PrivateKey</th>
                        <th>Command</th>
                    </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>

            <div class="actions-row">
                <button id="add" type="button" onclick="add({});" class="btn btn-primary" data-i18n="hosts.add">添加主机</button>
            </div>

            <form id="save" action="/save" method="Post" style="margin: 0;">
                <textarea id="config" name="config" style="display: none"></textarea>
                <div class="actions-row" style="margin-top: 24px; border-top: 1px solid #eef1f4; padding-top: 16px;">
                    <button id="submit" type="submit" class="btn btn-primary" data-i18n="btn.save">保存</button>
                    <button type="button" onclick="window.location.href = '/';" class="btn btn-secondary" data-i18n="btn.back">返回</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="js/jquery.min.js"></script>
<script src="js/i18n.js"></script>
<script type="application/javascript">
    $(document).ready(function (){
        $.ajax({
            url: '/config.json?_t=' + new Date().getTime(),
            success: function (res){
                var hosts = res.sshHosts;
                for(var i in hosts){
                    add(hosts[i]);
                }
                $('body').show();
            }
        });
    });

    var checkedRow = null;

    function add(info) {
        info = $.extend({
            name: '',
            hostname: '',
            port: '',
            username: '',
            password: '',
            command: '',
        }, info);
        var tr = '' +
            '<tr>' +
            '  <td>' +
            '    <input name="check" onchange="checkedRow=$(this).parent().parent();" type="radio" style="vertical-align: middle;"/>' +
            '  </td>' +
            '  <td>' +
            '    <input class="form-control" value="$name"/>' +
            '  </td>' +
            '  <td>' +
            '    <input class="form-control" value="$hostname"/>' +
            '  </td>' +
            '  <td>' +
            '    <input class="form-control" value="$port"/>' +
            '  </td>' +
            '  <td>' +
            '    <input class="form-control" value="$username"/>' +
            '  </td>' +
            '  <td>' +
            '    <input class="form-control" type="password" onfocus="$(this).attr(\'type\', \'\')" onblur="$(this).attr(\'type\', \'password\')" value="$password"/>' +
            '  </td>' +
            '  <td>' +
            '    <textarea class="form-control" rows="1">$privatekey</textarea>' +
            '  </td>' +
            '  <td>' +
            '    <textarea class="form-control" rows="1">$command</textarea>' +
            '  </td>' +
            '</tr>';
        $('tbody').append($(
            tr
                .replace('$name', info.name)
                .replace('$hostname', info.hostname)
                .replace('$port', info.port)
                .replace('$username', info.username)
                .replace('$password', info.password || '')
                .replace('$privatekey', info.privatekey || '')
                .replace('$command', unescape(info.command))
        ));
    }

    $('#submit').click(function () {
        var append = [];
        $('tbody tr').each(function () {
            var inputs = $(this).find('.form-control');
            var hostinfo = {
                name: inputs.eq(0).val(),
                hostname: inputs.eq(1).val(),
                port: inputs.eq(2).val(),
                username: inputs.eq(3).val(),
                password: inputs.eq(4).val(),
                privatekey: inputs.eq(5).val(),
                command: inputs.eq(6).val()
            };
            append.push(hostinfo);
        });
        $.ajax({
            url: '/config.json?_t=' + new Date().getTime(),
            async: false,
            success: function (res){
                res.sshHosts = append;
                $('#config').text(JSON.stringify(res, 0, 4));
            }
        });
    });
</script>
</body>
</html>
